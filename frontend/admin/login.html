<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../css/fonts.css"><link rel="stylesheet" href="../assets/vendor/fa/all.min.css"><link rel="stylesheet" href="../css/admin.css"><title>Masuk · ACICU Admin</title></head>
<body class="login"><form class="login-card" id="loginForm" novalidate>
<img class="logo" src="../assets/img/logo.jpg" alt="ACICU">
<h1>ACICU</h1><div class="tag-line">ANEKA ACI BUNGCU</div><p class="sub">Portal Resmi Admin &amp; Pengelola Dapur</p>
<div class="alert hidden" id="loginError" role="alert"></div>
<label class="l" for="login"><i class="fa-solid fa-user"></i>Username / Email</label>
<div class="in"><i class="fa-solid fa-user"></i><input id="login" name="login" autocomplete="username" placeholder="Username atau email" required></div>
<label class="l" for="password"><i class="fa-solid fa-lock"></i>Kata Sandi</label>
<div class="in"><i class="fa-solid fa-lock"></i><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Kata sandi" required><button type="button" class="eye" id="togglePw" aria-label="Tampilkan sandi"><i class="fa-solid fa-eye"></i></button></div>
<div class="login-row"><label class="check"><input type="checkbox" id="remember"> Ingat saya</label><a id="forgot">Lupa Password?</a></div>
<button class="btn primary" id="loginBtn" type="submit">Login ke Dashboard <i class="fa-solid fa-arrow-right"></i></button>
<div class="secure"><i class="fa-solid fa-shield-halved"></i>Sistem Terenkripsi &amp; Khusus Pengelola Dapur ACICU</div>
</form><script src="../js/config.js"></script><script src="../js/common.js"></script><script src="../js/api.js"></script><script src="../js/admin/admin.js"></script><script src="../js/admin/login.js"></script></body></html>
